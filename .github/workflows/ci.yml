name: CI
on:
    pull_request:
        branches:
            - main
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install flake8
            - name: Run linter
              run: flake8 .
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install pytest httpx pytest-asyncio
            - name: Run pytest
              run: pytest tests/test_auth.py -v